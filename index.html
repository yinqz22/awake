<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0F14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Awake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="workouts.css">
<link rel="icon" type="image/png" href="favicon-32.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.json?v=3">
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card fade">
    <div class="auth-logo"><span class="brand">awake</span></div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Anmelden</button>
      <button id="tabReg" onclick="switchTab('register')">Registrieren</button>
    </div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>Name</label><input id="loginName" required></div>
      <div class="field"><label>Passwort</label><input id="loginPass" type="password" required></div>
      <div class="err" id="loginErr"></div>
      <button class="btn-primary" type="submit">Anmelden</button>
    </form>
    <form id="regForm" class="hidden" onsubmit="return doRegister(event)">
      <div class="field"><label>Name</label><input id="regName" minlength="2" required><div class="hint">Mindestens 2 Buchstaben, muss einzigartig sein</div></div>
      <div class="field"><label>Passwort</label><input id="regPass" type="password" minlength="8" required><div class="hint">Mindestens 8 Zeichen und eine Zahl</div></div>
      <div class="err" id="regErr"></div>
      <button class="btn-primary" type="submit">Konto erstellen</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="sidebar">
    <button class="side-btn active" id="navHome" onclick="showView('home')" title="Home"><span class="ico ico-home"></span></button>
    <button class="side-btn" id="navAssistant" onclick="showView('assistant')" title="Assistent"><span class="ico ico-logo"></span></button>
    <button class="side-btn" id="navWorkouts" onclick="showView('workouts')" title="Workouts"><span class="ico ico-dumb"></span></button>
    <button class="side-btn" id="navSettings" onclick="showView('settings')" title="Einstellungen"><span class="ico ico-gear"></span></button>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="top-left" onclick="showView('home')"><span class="brand">awake</span></div>
      <div id="topMid"></div>
      <div class="top-right" onclick="showView('settings')">
        <span id="topName"></span>
        <div class="avatar" id="topAvatar"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="snowLayer"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="workouts.js"></script>
</body>
</html>
